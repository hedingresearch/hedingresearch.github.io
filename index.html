---
layout: default
class: page-home
---
<link rel="stylesheet" href="/css/swiper-bundle.min.css">
<script src="/js/swiper-bundle.min.js"></script>

<div class="home">

  <div class="content-wrapper">
    <div class="text-content">
      <h1 class="welcome-title">欢迎访问北京理工大学丁贺课题组网站！</h1>
      <p class="introduction-text">
      致力于光电信息技术与生命科学交叉领域的研究，旨在开发新的机制、设计和应用来解决当前植入式系统面临的挑战，作为脑科学领域中进行传感、调控和治疗的有效工具。
      </p>
    </div>

    <div class="carousel-container">
      <div class="swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="/images/variety/coil powered wireless voilet red LED.jpg" alt="Image 1"></div>
          <div class="swiper-slide"><img src="/images/variety/implantable LED probe.png" alt="Image 2"></div>
          <div class="swiper-slide"><img src="/images/variety/implantable UC devices.png" alt="Image 3"></div>
          <div class="swiper-slide"><img src="/images/variety/upconversion-devices.png" alt="Image 4"></div>

          <!-- 可以添加更多的图片 -->
        </div>
        <!-- 添加分页器和导航按钮 -->
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
    var swiper = new Swiper('.swiper', {
      loop: true, // 循环模式
      autoplay: {
        delay: 2500, // 自动切换时间间隔
        disableOnInteraction: false, // 用户操作后是否禁用自动切换
      },
      pagination: {
        el: '.swiper-pagination',
        clickable: true, // 是否可以点击分页器切换
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      effect: 'fade', // 切换效果
    });
  });
</script>
